name: Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Ubuntu 26.04's apparmor package confines /usr/sbin/mosquitto to files
      # under /etc/mosquitto, so the TLS fixture's config and certs in the
      # pytest temp dir are denied and the broker exits. Unload that profile.
      - name: Install mosquitto
        run: |
          sudo apt-get install -y mosquitto
          if [ -f /etc/apparmor.d/mosquitto ]; then
            sudo apparmor_parser -R /etc/apparmor.d/mosquitto || true
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "${{ matrix.python-version }}"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.13"
          python-version: "${{ matrix.python-version }}"

      - name: Install package + all extras from uv.lock
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --frozen pytest -v --tb=short

  # The shared local runtime reads a Unix socket peer's uid, and the API for
  # that is per-platform: SO_PEERCRED on Linux, LOCAL_PEERCRED on Darwin. The
  # ubuntu job above cannot exercise the Darwin path at all. One row is enough
  # because the platform is the variable here, not the Python version, and
  # tests/test_local_rpc.py needs no broker.
  local-runtime-macos:
    name: "Local runtime (macOS, Python ${{ matrix.python-version }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "${{ matrix.python-version }}"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.13"
          python-version: "${{ matrix.python-version }}"

      - name: Install package + all extras from uv.lock
        run: uv sync --frozen --all-extras

      # --basetemp is required, not tidiness. macOS resolves the default
      # temp dir to /private/var/folders/<2>/<30>/T, so pytest's
      # pytest-of-<user>/pytest-<n>/<test-name-truncated-to-30><n> puts
      # tmp_path at ~114 bytes -- past the 104-byte sun_path in Darwin's
      # struct sockaddr_un, so every AF_UNIX bind here would fail with
      # "AF_UNIX path too long" before the test ran. Linux's /tmp leaves
      # ~32 bytes of headroom, which is why this only bites here.
      # The directory is cleared blindly at startup, so it must stay a
      # dedicated leaf and never a shared path.
      - name: Run the local runtime tests
        run: >
          uv run --frozen pytest -v --tb=short
          --basetemp=/tmp/swarmbus-pytest
          tests/test_local_rpc.py
